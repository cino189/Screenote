[package]
name = "screenote"
version = "0.1.0"
edition = "2024"
description = "Lightweight, desktop-environment-agnostic Wayland screenshot and annotation tool"
license = "MIT"
readme = "README.md"
keywords = ["wayland", "screenshot", "annotation", "linux", "portal"]
categories = ["multimedia::images", "gui", "command-line-utilities"]

[[bin]]
name = "screenote"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
ashpd = { version = "0.14.3", default-features = false, features = [
    "async-io",
    "screenshot",
    "file_chooser",
] }
clap = { version = "4.5", features = ["derive"] }
cosmic-text = "0.19.0"
dirs = "7.0.0"
eframe = { version = "0.37.0", default-features = false, features = [
    "wayland",
    "glow",
    "default_fonts",
] }
futures-lite = "2.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
tiny-skia = "0.12.0"
url = "2.5"
winit = { version = "0.30", default-features = false, features = [
    "wayland",
    "wayland-dlopen",
    "wayland-csd-adwaita",
] }
wl-clipboard-rs = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
